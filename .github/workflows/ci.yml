name: Tests and real CPU examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[demo,dev]" -r requirements-demo.txt
      - run: python -m pytest -q
      - run: python -m flightdeck.cli audit docs/site/temperature-rules
      - run: python examples/prepare.py --out runs/cards
      - run: python examples/benchmark.py --cards runs/cards --out runs/benchmark
      - run: python -m build
